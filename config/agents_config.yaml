# 에이전트별 모델/파라미터 설정
# 예시:
# drafter:
#   model: gpt-4o-mini
#   temperature: 0.2

drafter: # 얘는 진짜 초안용
  provider: "gemini" # openai_compatible | nvidia_nim | gemini
  model: "gemini-2.5-flash-lite" # 저비용: 목차/초안 뼈대 작성
  api_key_env: "GEMINI_API_KEY"
  fallback_models:
    - "gemini-2.5-flash-lite"
  #provider: "nvidia_nim"
  #model: "openai/gpt-oss-120b"
  #api_key_env: "NIM_API_KEY"
  #fallback_models:
  #  - "nvidia/nemotron-3-super-120b-a12b"
  #  - "nvidia/nemotron-3.5-lightning-30b-a3b"
  #  - "openai/gpt-oss-20b"
  #base_url: "https://integrate.api.nvidia.com/v1"
  max_input_tokens: 16384
  max_output_tokens: 16384
  max_retries: 2
  timeout_seconds: 45

researcher: # 저비용: 다회 호출 조사/요약 모델임
  provider: "gemini" # openai_compatible | nvidia_nim | gemini
  model: "gemini-2.5-flash-lite" # 저비용: 목차/초안 뼈대 작성
  api_key_env: "GEMINI_API_KEY"
  fallback_models:
    - "gemini-2.5-flash-lite"
  #provider: "nvidia_nim"
  #model: "nvidia/nemotron-3-super-120b-a12b"
  #api_key_env: "NIM_API_KEY"
  #fallback_models:
  #  - "nvidia/nemotron-3.5-lightning-30b-a3b"
  #  - "nvidia/llama-3.1-nemotron-70b-instruct"
  #  - "openai/gpt-oss-120b"
  #  - "openai/gpt-oss-20b"
  #base_url: "https://integrate.api.nvidia.com/v1"
  max_input_tokens: 16384
  max_output_tokens: 16384
  max_retries: 3
  timeout_seconds: 60

expander: # 고비용: 논리적으로 추론해야 함
  provider: "gemini"
  model: "gemini-2.5-flash-lite" # 품질/비용 균형: 본문 확장
  api_key_env: "GEMINI_API_KEY"
  fallback_models:
    - "gemini-2.5-flash-lite"
  #provider: "nvidia_nim"
  #model: "nvidia/nemotron-3-ultra-550b-a55b" # 503/504에 취약하므로 운영 시 사용을 제한
  #api_key_env: "NIM_API_KEY"
  #fallback_models:
  #  - "nvidia/nemotron-3-super-120b-a12b"
  #  - "google/gemma-4-31b-it"
  #  - "openai/gpt-oss-20b"
  #  - "nvidia/nemotron-3.5-lightning-30b-a3b"
  #base_url: "https://integrate.api.nvidia.com/v1"
  max_input_tokens: 16384
  max_output_tokens: 16384
  max_retries: 1
  timeout_seconds: 90
  extra_body:
    reasoning_budget: 16384

