  max_input_tokens: 32768
  max_output_tokens: 8192
  max_retries: 2
  timeout_seconds: 60
  temperature: 0.2

gatekeeper:
  provider: "gemini"
  model: "gemini-2.5-flash-lite"
  api_key_env: "GEMINI_API_KEY"
  fallback_models:
    - "gemini-2.5-flash"
  max_input_tokens: 16384
  max_output_tokens: 4096
  max_retries: 2
  timeout_seconds: 45
  temperature: 0.1

merger:
  provider: "gemini"
  model: "gemini-2.5-flash-lite"
