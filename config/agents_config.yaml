# 에이전트별 모델 및 파라미터 구성
# 기본 제공자(Default Provider): nvidia_nim
# 대체 제공자(Fallback Provider): gemini / openai_compatible

drafter: # 목차 기획 및 초안 작성
  provider: "nvidia_nim" # openai_compatible | nvidia_nim | gemini
  model: "nvidia/nemotron-3-super-120b-a12b"
  fallback_models:
    - provider: "nvidia_nim" # openai_compatible | nvidia_nim | gemini
      model: "nvidia/nemotron-3.5-lightning-30b-a3b"
    - provider: "nvidia_nim"
      model: "openai/gpt-oss-20b"
    - provider: "gemini"
      model: "gemini-2.5-flash"
  max_input_tokens: 16000
  max_output_tokens: 4096
  max_retries: 2
  timeout_seconds: 60
  temperature: 0.2

researcher: # 저비용: 다회 호출 조사/요약 모델
  provider: "nvidia_nim"
  model: "nvidia/nemotron-3-super-120b-a12b"
  fallback_models:
    - provider: "nvidia_nim"
      model: "nvidia/nemotron-3.5-lightning-30b-a3b"
    - provider: "nvidia_nim"
      model: "openai/gpt-oss-20b"
    - provider: "gemini"
      model: "gemini-2.5-flash"
  max_input_tokens: 16000
  max_output_tokens: 4096
  max_retries: 3
  timeout_seconds: 60
  temperature: 0.2

expander: # 고성능: 세부 챕터 및 논리적 본문 확장
  provider: "nvidia_nim"
  model: "nvidia/nemotron-3-ultra-550b-a55b"
  fallback_models:
    - provider: "nvidia_nim"
      model: "nvidia/nemotron-3-super-120b-a12b"
    - provider: "nvidia_nim"
      model: "nvidia/nemotron-3.5-lightning-30b-a3b"
    - provider: "nvidia_nim"
      model: "openai/gpt-oss-120b"
    - provider: "gemini"
      model: "gemini-2.5-flash"
  max_input_tokens: 32768
  max_output_tokens: 8192
  max_retries: 2
  timeout_seconds: 90
  temperature: 0.3

reviewer: # 서식, 어조 및 품질 교열
  provider: "nvidia_nim"
  model: "nvidia/nemotron-3.5-lightning-30b-a3b"
  fallback_models:
    - provider: "nvidia_nim"
      model: "nvidia/nemotron-3-super-120b-a12b"
    - provider: "nvidia_nim"
      model: "openai/gpt-oss-120b"
    - provider: "gemini"
      model: "gemini-2.5-flash"
  max_input_tokens: 32768
  max_output_tokens: 8192
  max_retries: 2
  timeout_seconds: 60
  temperature: 0.2

gatekeeper: # 분량 및 코어 방어선 심사
  provider: "nvidia_nim"
  model: "nvidia/nemotron-3-super-120b-a12b"
  fallback_models:
    - provider: "nvidia_nim"
      model: "nvidia/nemotron-3.5-lightning-30b-a3b"
    - provider: "nvidia_nim"
      model: "openai/gpt-oss-120b"
    - provider: "gemini"
      model: "gemini-2.5-flash"
  max_input_tokens: 16384
  max_output_tokens: 4096
  max_retries: 2
  timeout_seconds: 45
  temperature: 0.1

merger: # 최종 통합 마크다운 합성 및 참고문헌/약어표 빌더
  provider: "nvidia_nim"
  model: "nvidia/nemotron-3.5-lightning-30b-a3b"
  fallback_models:
    - provider: "nvidia_nim"
      model: "nvidia/nemotron-3-super-120b-a12b"
    - provider: "nvidia_nim"
      model: "openai/gpt-oss-120b"
    - provider: "gemini"
      model: "gemini-2.5-flash"
  max_input_tokens: 32768
  max_output_tokens: 8192
  max_retries: 2
  timeout_seconds: 60
  temperature: 0.1

# ==============================================================================
# 모델 및 제공자 참고 메타데이터 (Model Reference & Rate Limits)
# ==============================================================================
#
# [Gemini Rate Limits]
# 계정별 실제 쿼터에 맞춰 rate_limits 설정을 에이전트 블록에 추가할 수 있습니다:
# rate_limits:
#   requests_per_minute: 5
#   tokens_per_minute: 30000
#
# Gemini 모델 상태:
#   - gemini-2.5-flash          : [사용 가능] 기본 권장 안정 모델
#   - gemini-3.5-flash          : [사용 가능] 고품질 모델 (호출 횟수 제한 주의)
#   - gemini-3.5-flash-lite     : [사용 가능] 경량 모델
#   - gemini-3.1-flash-lite     : [사용 가능] 경량 모델
#   - gemini-3.1-pro-preview    : [사용 가능] 프리뷰 모델
#   - gemini-2.5-flash-lite     : [차단] 계정 권한/유효성 오류 빈발로 제외됨
#   - deep-research-*-preview   : [차단] 일반 API 호출 불가
#
# [NVIDIA NIM Models]
#   - nvidia/nemotron-3.5-lightning-30b-a3b : [사용 가능] 저비용 고속: 다회 조사/교열/기획
#   - nvidia/nemotron-3-super-120b-a12b     : [사용 가능] 고성능: 논리적 본문 확장
#   - nvidia/nemotron-3-nano-30b-a3b        : [사용 가능] 초경량 모델
#   - openai/gpt-oss-20b                    : [사용 가능] 오픈소스 경량 폴백
#   - openai/gpt-oss-120b                   : [사용 가능] 오픈소스 중대형 폴백
#   - mistral/mistral-nemotron              : [사용 가능] 미스트랄 계열
#   - nvidia/nemotron-3-ultra-550b-a55b     : [주의] 503/504 타임아웃 빈발
#   - google/gemma-4-31b-it                 : [차단] 호출 불가/지원 중단
#   - meta/llama-3.1-70b-instruct           : [차단] 지원 중단 (Llama 3.3으로 대체 필요)
#   - nvidia/llama-3.1-nemotron-70b-instruct: [차단] Deprecated/Unavailable
