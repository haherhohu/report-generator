# 에이전트별 모델 및 파라미터 구성
# 기본 제공자(Default Provider): gemini
# 대체 제공자(Fallback Provider): nvidia_nim / openai_compatible

drafter:
  provider: "gemini"
  model: "gemini-2.5-flash"
  api_key_env: "GEMINI_API_KEY"
  fallback_models:
    - "gemini-2.5-flash-lite"
    - "nvidia/nemotron-3.5-lightning-30b-a3b"
  max_input_tokens: 32768
  max_output_tokens: 8192
  max_retries: 2
  timeout_seconds: 60
  temperature: 0.2

researcher:
  provider: "gemini"
  model: "gemini-2.5-flash-lite"
  api_key_env: "GEMINI_API_KEY"
  fallback_models:
    - "gemini-2.5-flash"
    - "google/gemma-4-31b-it"
    - "nvidia/nemotron-3.5-lightning-30b-a3b"
  max_input_tokens: 32768
  max_output_tokens: 8192
  max_retries: 3
  timeout_seconds: 60
  temperature: 0.2

