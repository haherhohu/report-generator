# 에이전트별 모델 및 파라미터 구성
# 기본 제공자(Default Provider): nvidia_nim
# 대체 제공자(Fallback Provider): gemini / openai_compatible

drafter:
  provider: "nvidia_nim"
  model: "nvidia/nemotron-3.5-lightning-30b-a3b"
  api_key_env: "NIM_API_KEY"
  base_url: "https://integrate.api.nvidia.com/v1"
  fallback_models:
    - "nvidia/llama-3.1-nemotron-70b-instruct"
    - "google/gemma-4-31b-it"
    - "gemini-2.5-flash"
  max_input_tokens: 32768
  max_output_tokens: 8192
  max_retries: 2
  timeout_seconds: 60
  temperature: 0.2

researcher:
  provider: "nvidia_nim"
  model: "nvidia/nemotron-3.5-lightning-30b-a3b"
