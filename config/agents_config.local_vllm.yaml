# 로컬 vLLM + LiteLLM 구성을 위한 에이전트 모델 설정 템플릿
# 사용 방법:
# 1) 이 파일을 검토/수정 후 config/agents_config.yaml로 교체
# 2) .env에서 OPENAI_BASE_URL, OPENAI_API_KEY를 LiteLLM 값으로 설정
#
# 예시:
# OPENAI_BASE_URL=http://127.0.0.1:4000/v1
# OPENAI_API_KEY=<LITELLM_MASTER_KEY>

drafter:
  provider: "openai_compatible"
  model: "llama-3.1-8b-instruct"
  fallback_models:
    - provider: "openai_compatible"
      model: "gemma-4-26b-instruct"
  max_input_tokens: 16000
  max_output_tokens: 4096
  max_retries: 2
  timeout_seconds: 60
  temperature: 0.2

researcher:
  provider: "openai_compatible"
  model: "llama-3.1-8b-instruct"
  fallback_models:
    - provider: "openai_compatible"
      model: "gemma-4-26b-instruct"
  max_input_tokens: 16000
  max_output_tokens: 4096
  max_retries: 3
  timeout_seconds: 60
  temperature: 0.2

expander:
  provider: "openai_compatible"
  model: "gemma-4-26b-instruct"
  fallback_models:
    - provider: "openai_compatible"
      model: "llama-3.1-8b-instruct"
  max_input_tokens: 32768
  max_output_tokens: 8192
  max_retries: 2
  timeout_seconds: 90
  temperature: 0.3

reviewer:
  provider: "openai_compatible"
  model: "llama-3.1-8b-instruct"
  fallback_models:
    - provider: "openai_compatible"
      model: "gemma-4-26b-instruct"
  max_input_tokens: 32768
  max_output_tokens: 8192
  max_retries: 2
  timeout_seconds: 60
  temperature: 0.2

gatekeeper:
  provider: "openai_compatible"
  model: "gemma-4-26b-instruct"
  fallback_models:
    - provider: "openai_compatible"
      model: "llama-3.1-8b-instruct"
  max_input_tokens: 16384
  max_output_tokens: 4096
  max_retries: 2
  timeout_seconds: 45
  temperature: 0.1

merger:
  provider: "openai_compatible"
  model: "gemma-4-26b-instruct"
  fallback_models:
    - provider: "openai_compatible"
      model: "llama-3.1-8b-instruct"
  max_input_tokens: 32768
  max_output_tokens: 8192
  max_retries: 2
  timeout_seconds: 60
  temperature: 0.1
