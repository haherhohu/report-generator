# example
# topic: "노스다코타 및 Vantis 벤치마킹을 통한 K-UAS 드론 인증 체계 구축 방안"
# direction: "4~7장 기획은 완료됨. 2~3장에 Vantis 및 노스다코타 NPUASTS 관련 최신 기술/시장/정책 동향을 조사하여 분량을 확장할 것."
# target_perspective: "국토교통부 관점 (인프라 구축, 민간 상용화, 항로 관제 및 안전 인증 기준 중심)"

topic: "AI, 빅데이터 등 융합 UAV 최신 기술동향 분석"
direction:
  - 1) 기존 'UAS 분류체계'의 내용을 참조하여 기술분류체계를 구성하고, 보완할 것.
  - 2) 기존 작성된 '위성 기반 차세대 무인기 실증체계(K-Vantis) 구축 및 활용 전략' 의 내용을 참조하여, 실증을 위한 기술분류체계가 마련되어야 함을 제시.
  - 3) AI 빅데이타 등을 고려하여 UAS의 기술동향을 작성하되 반드시 위성기반으로 하는 UAS 관제/모니터링 동향을 조사.
  - 4) (향후) 위성 기반으로 추진된다는 내용을 포함할 것.
  - 5) 동향을 기반으로 기술 분류체계를 만들고 기술 카드를 제시할 것.
target_perspective: "산업부 관점 (위성기반 UAS 부품/기체 중심)이지만 분류체계 자체를 구성할 때에는 관제/운영 관점까지 포함하여야 함."

# 선택값: 여기에서 파이프라인 설정을 개별 실행마다 덮어쓸 수 있음
# max_loops: 2
# max_concurrency: 5
# target_6_min_length: 3000
# target_total_min_length: 50000
